name: ecofriendly
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'  

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.0
  font_awesome_flutter: ^10.0.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.1.10
  flutter_launcher_icons: ^0.13.1
  fluttertoast: ^8.2.4 
  provider: ^6.1.1
  mailer: ^6.0.0
  firebase_core: ^2.27.0
  firebase_auth: ^4.16.0 
  firebase_database: ^10.5.7
  firebase_storage: ^11.0.16
  firebase_app_check: ^0.2.1+5
  cloud_firestore: ^4.14.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  http: ^0.13.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.jpeg"
